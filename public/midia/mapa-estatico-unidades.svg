<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Mapa ilustrado da avenida principal de Monte Verde: a loja da Galeria Suíça fica dentro da galeria, no lado sul; a Vila Germânica é loja de rua no lado norte">
  <rect width="800" height="600" fill="#12291F"/>

  <!-- mata no canto noroeste, como no mapa real -->
  <path d="M-10 -10 H300 C 250 50 180 80 110 84 C 60 88 20 96 -10 92 Z" fill="#0E2119"/>
  <g stroke="#24503C" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.9">
    <path d="M70 44 l0 18 M70 44 l-8 12 h16 z M70 51 l-11 14 h22 z"/>
    <path d="M170 30 l0 18 M170 30 l-8 12 h16 z M170 37 l-11 14 h22 z"/>
  </g>

  <!-- quarteirões discretos -->
  <g fill="#163026">
    <rect x="330" y="120" width="150" height="120" rx="8"/>
    <rect x="60" y="150" width="180" height="140" rx="8"/>
    <rect x="90" y="480" width="150" height="90" rx="8"/>
    <rect x="420" y="500" width="160" height="80" rx="8"/>
    <rect x="660" y="440" width="110" height="120" rx="8"/>
  </g>

  <!-- ruas secundárias -->
  <g stroke="#F0E6D2" stroke-opacity="0.28" stroke-width="12" stroke-linecap="round" fill="none">
    <path d="M470 96 C 452 220 440 320 428 402"/>
    <path d="M700 120 L 694 585"/>
  </g>
  <g fill="#F0E6D2" fill-opacity="0.5" font-family="Georgia, serif" font-size="14" font-style="italic">
    <text transform="translate(466 170) rotate(82)">Al. Pinheral</text>
    <text transform="translate(688 190) rotate(88)">R. da Mantiqueira</text>
  </g>

  <!-- Praça da Árvore (referência real, a leste) -->
  <g>
    <rect x="722" y="300" width="66" height="60" rx="12" fill="#1F4534"/>
    <g stroke="#8FBF7F" stroke-width="2.5" fill="none" stroke-linecap="round">
      <path d="M755 318 l0 22 M755 318 l-10 14 h20 z M755 326 l-12 15 h24 z"/>
    </g>
    <text x="755" y="378" text-anchor="middle" fill="#F0E6D2" fill-opacity="0.7" font-family="Georgia, serif" font-size="12" font-style="italic">Praça da Árvore</text>
  </g>

  <!-- AVENIDA PRINCIPAL (sobe para nordeste, como no real) -->
  <path d="M-20 470 C 150 452 280 448 420 415 C 550 385 670 378 820 355" stroke="#F0E6D2" stroke-opacity="0.9" stroke-width="26" fill="none" stroke-linecap="round"/>
  <path d="M-20 470 C 150 452 280 448 420 415 C 550 385 670 378 820 355" stroke="#12291F" stroke-width="2.5" fill="none" stroke-dasharray="13 11"/>
  <text transform="translate(60 498) rotate(-5)" fill="#F0E6D2" fill-opacity="0.65" font-family="Georgia, serif" font-size="18" font-style="italic">Av. Monte Verde</text>

  <!-- acesso que contorna a galeria (lado sul), como no real -->
  <path d="M262 462 C 268 500 300 520 350 522 C 400 524 428 500 430 468" stroke="#F0E6D2" stroke-opacity="0.28" stroke-width="10" fill="none" stroke-linecap="round"/>

  <!-- GALERIA SUÍÇA: prédio da galeria no lado SUL, com a loja DENTRO -->
  <g>
    <!-- prédio da galeria -->
    <rect x="200" y="470" width="200" height="86" rx="10" fill="#1A3A2C" stroke="#B08D3E" stroke-width="1.8"/>
    <path d="M192 470 L300 432 L408 470" fill="none" stroke="#B08D3E" stroke-width="2.2" stroke-linejoin="round"/>
    <!-- arcadas da galeria -->
    <g stroke="#B08D3E" stroke-width="1.6" fill="none" opacity="0.85">
      <path d="M222 556 v-30 a12 12 0 0 1 24 0 v30"/>
      <path d="M262 556 v-30 a12 12 0 0 1 24 0 v30"/>
      <path d="M342 556 v-30 a12 12 0 0 1 24 0 v30"/>
    </g>
    <text x="300" y="590" text-anchor="middle" fill="#F0E6D2" fill-opacity="0.75" font-family="Georgia, serif" font-size="13" font-style="italic">Galeria Suíça (galeria de lojas)</text>
    <!-- pin da loja DENTRO da galeria -->
    <path d="M310 530 C 300 514 292 506 292 494 a18 18 0 1 1 36 0 c0 12 -8 20 -18 36 Z" fill="#D4B36A"/>
    <circle cx="310" cy="494" r="6.5" fill="#12291F"/>
    <!-- placa -->
    <line x1="180" y1="392" x2="286" y2="470" stroke="#B08D3E" stroke-width="2"/>
    <rect x="36" y="320" width="290" height="72" rx="10" fill="#1A3A2C" stroke="#B08D3E" stroke-width="1.6"/>
    <text x="181" y="350" text-anchor="middle" fill="#FAF6ED" font-family="Georgia, serif" font-size="21" font-weight="bold">Arsenal · Galeria Suíça</text>
    <text x="181" y="375" text-anchor="middle" fill="#F0E6D2" fill-opacity="0.75" font-family="Georgia, serif" font-size="14">loja 4, dentro da galeria · nº 858</text>
  </g>

  <!-- VILA GERMÂNICA: loja de rua no lado NORTE, a leste -->
  <g>
    <!-- chalé da loja -->
    <rect x="540" y="300" width="96" height="62" rx="8" fill="#1A3A2C" stroke="#B08D3E" stroke-width="1.8"/>
    <path d="M534 300 L588 266 L642 300" fill="none" stroke="#B08D3E" stroke-width="2.2" stroke-linejoin="round"/>
    <!-- pin da loja -->
    <path d="M588 352 C 578 336 570 328 570 316 a18 18 0 1 1 36 0 c0 12 -8 20 -18 36 Z" fill="#D4B36A"/>
    <circle cx="588" cy="316" r="6.5" fill="#12291F"/>
    <!-- placa -->
    <line x1="588" y1="266" x2="588" y2="230" stroke="#B08D3E" stroke-width="2"/>
    <rect x="443" y="158" width="290" height="72" rx="10" fill="#1A3A2C" stroke="#B08D3E" stroke-width="1.6"/>
    <text x="588" y="188" text-anchor="middle" fill="#FAF6ED" font-family="Georgia, serif" font-size="21" font-weight="bold">Arsenal · Vila Germânica</text>
    <text x="588" y="213" text-anchor="middle" fill="#F0E6D2" fill-opacity="0.75" font-family="Georgia, serif" font-size="14">loja de rua · Av. Monte Verde, 1057</text>
  </g>

  <!-- legenda + escala + bússola -->
  <text x="36" y="42" fill="#F0E6D2" fill-opacity="0.6" font-family="Georgia, serif" font-size="15">Uma em cada lado da avenida — poucos minutos a pé entre elas</text>
  <g transform="translate(646 566)">
    <line x1="0" y1="0" x2="90" y2="0" stroke="#F0E6D2" stroke-opacity="0.6" stroke-width="2"/>
    <line x1="0" y1="-5" x2="0" y2="5" stroke="#F0E6D2" stroke-opacity="0.6" stroke-width="2"/>
    <line x1="90" y1="-5" x2="90" y2="5" stroke="#F0E6D2" stroke-opacity="0.6" stroke-width="2"/>
    <text x="45" y="-10" text-anchor="middle" fill="#F0E6D2" fill-opacity="0.55" font-family="Georgia, serif" font-size="12">≈ 150 m</text>
  </g>
  <g transform="translate(756 78)">
    <circle r="22" fill="none" stroke="#B08D3E" stroke-width="1.6" opacity="0.9"/>
    <path d="M0 -13 L5.5 7 L0 3 L-5.5 7 Z" fill="#D4B36A"/>
    <text y="-28" text-anchor="middle" fill="#F0E6D2" fill-opacity="0.7" font-family="Georgia, serif" font-size="13">N</text>
  </g>
</svg>
