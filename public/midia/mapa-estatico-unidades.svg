<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Mapa fiel da avenida principal de Monte Verde: Arsenal Galeria Suíça dentro da galeria no lado sul e Arsenal Vila Germânica, loja de rua no lado norte, a cerca de 230 metros (3 minutos a pé) uma da outra, com o Termômetro Oficial e comércios entre elas e a Praça da Árvore com o Bradesco logo após a Vila Germânica">
  <rect width="800" height="600" fill="#12291F"/>

  <!-- mata ao norte da R. das Siriemas (como no mapa real) -->
  <path d="M0 132 C 180 112 360 78 560 38 C 650 20 730 8 800 -2 L 800 -20 L 0 -20 Z" fill="#0E2119"/>
  <g stroke="#24503C" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.9">
    <path d="M110 62 l0 15 M110 62 l-8 10 h16 z M110 68 l-10 12 h20 z"/>
    <path d="M330 40 l0 15 M330 40 l-8 10 h16 z M330 46 l-10 12 h20 z"/>
    <path d="M600 14 l0 15 M600 14 l-8 10 h16 z M600 20 l-10 12 h20 z"/>
  </g>

  <!-- casario (manchas de quadras como no Google Maps) -->
  <g fill="#163026">
    <rect x="80" y="200" width="54" height="38" rx="4"/>
    <rect x="180" y="176" width="46" height="34" rx="4"/>
    <rect x="300" y="152" width="52" height="36" rx="4"/>
    <rect x="500" y="120" width="48" height="34" rx="4"/>
    <rect x="640" y="96" width="52" height="36" rx="4"/>
    <rect x="60" y="420" width="60" height="44" rx="4"/>
    <rect x="350" y="400" width="56" height="40" rx="4"/>
    <rect x="450" y="360" width="50" height="38" rx="4"/>
    <rect x="480" y="470" width="58" height="42" rx="4"/>
    <rect x="330" y="500" width="54" height="40" rx="4"/>
    <rect x="600" y="430" width="52" height="40" rx="4"/>
    <rect x="740" y="330" width="46" height="38" rx="4"/>
  </g>

  <!-- ruas reais: R. das Siriemas (paralela, ao norte) -->
  <path d="M340 132 C 470 106 600 66 780 4" stroke="#F0E6D2" stroke-opacity="0.26" stroke-width="11" fill="none" stroke-linecap="round"/>
  <text transform="translate(288 146) rotate(-13)" fill="#F0E6D2" fill-opacity="0.5" font-family="Georgia, serif" font-size="13" font-style="italic">R. das Siriemas</text>

  <!-- rua que sobe da avenida para a Siriemas -->
  <path d="M406 287 C 410 230 415 170 417 110 L 420 0" stroke="#F0E6D2" stroke-opacity="0.26" stroke-width="10" fill="none" stroke-linecap="round"/>

  <!-- R. da Mantiqueira: desce para o sul logo depois da Vila Germânica -->
  <path d="M647 226 C 660 262 677 330 700 420 C 712 470 724 540 730 600" stroke="#F0E6D2" stroke-opacity="0.28" stroke-width="11" fill="none" stroke-linecap="round"/>
  <text transform="translate(697 352) rotate(74)" fill="#F0E6D2" fill-opacity="0.5" font-family="Georgia, serif" font-size="13" font-style="italic">R. da Mantiqueira</text>

  <!-- PRAÇA DA ÁRVORE + BRADESCO (a leste da Vila Germânica, antes da Mantiqueira) -->
  <g>
    <rect x="580" y="248" width="68" height="52" rx="10" fill="#1F4534"/>
    <g stroke="#B08D3E" stroke-width="1.7" fill="none" stroke-linejoin="round">
      <rect x="588" y="258" width="20" height="15" rx="2"/>
      <path d="M585 258 L598 249 L611 258"/>
    </g>
    <g stroke="#8FBF7F" stroke-width="2.4" fill="none" stroke-linecap="round">
      <path d="M630 262 l0 20 M630 262 l-8 12 h16 z M630 269 l-11 14 h22 z"/>
    </g>
    <text x="614" y="320" text-anchor="middle" fill="#F0E6D2" fill-opacity="0.7" font-family="Georgia, serif" font-size="12" font-style="italic">Praça da Árvore · Bradesco</text>
  </g>

  <!-- AVENIDA MONTE VERDE: diagonal real, subindo para nordeste -->
  <path d="M-20 356 C 140 330 330 300 493 262 C 600 237 700 213 820 188" stroke="#F0E6D2" stroke-opacity="0.9" stroke-width="24" fill="none" stroke-linecap="round"/>
  <path d="M-20 356 C 140 330 330 300 493 262 C 600 237 700 213 820 188" stroke="#12291F" stroke-width="2.5" fill="none" stroke-dasharray="12 10"/>
  <text transform="translate(30 322) rotate(-10)" fill="#F0E6D2" fill-opacity="0.65" font-family="Georgia, serif" font-size="17" font-style="italic">Av. Monte Verde</text>

  <!-- TERMÔMETRO OFICIAL: calçadão norte, pouco depois da Galeria Suíça -->
  <g>
    <rect x="304" y="256" width="12" height="38" rx="6" fill="#F0E6D2"/>
    <rect x="307.5" y="263" width="5" height="24" rx="2.5" fill="#C25B4E"/>
    <circle cx="310" cy="290" r="8" fill="#C25B4E" stroke="#F0E6D2" stroke-width="2.2"/>
    <text x="296" y="250" text-anchor="end" fill="#F0E6D2" fill-opacity="0.75" font-family="Georgia, serif" font-size="13" font-style="italic">Termômetro</text>
  </g>

  <!-- comércios no calçadão norte, entre as lojas -->
  <g stroke="#B08D3E" stroke-width="1.6" fill="none" stroke-linejoin="round" opacity="0.8">
    <rect x="340" y="264" width="20" height="18" rx="2"/>
    <path d="M337 264 h26 l-4 -8 h-18 z"/>
    <rect x="374" y="257" width="20" height="18" rx="2"/>
    <path d="M371 257 h26 l-4 -8 h-18 z"/>
    <rect x="428" y="246" width="20" height="18" rx="2"/>
    <path d="M425 246 h26 l-4 -8 h-18 z"/>
  </g>
  <text x="386" y="232" text-anchor="middle" fill="#F0E6D2" fill-opacity="0.6" font-family="Georgia, serif" font-size="12" font-style="italic">comércios</text>

  <!-- ARSENAL GALERIA SUÍÇA: dentro da galeria, lado SUL -->
  <g>
    <rect x="150" y="352" width="146" height="66" rx="8" fill="#1A3A2C" stroke="#B08D3E" stroke-width="1.8"/>
    <path d="M144 352 L223 330 L302 352" fill="none" stroke="#B08D3E" stroke-width="2.2" stroke-linejoin="round"/>
    <g stroke="#B08D3E" stroke-width="1.5" fill="none" opacity="0.85">
      <path d="M166 418 v-20 a9 9 0 0 1 18 0 v20"/>
      <path d="M196 418 v-20 a9 9 0 0 1 18 0 v20"/>
      <path d="M258 418 v-20 a9 9 0 0 1 18 0 v20"/>
    </g>
    <path d="M223 410 C 215 397 208 390 208 380 a15 15 0 1 1 30 0 c0 10 -7 17 -15 30 Z" fill="#D4B36A"/>
    <circle cx="223" cy="380" r="5.5" fill="#12291F"/>
    <line x1="160" y1="430" x2="200" y2="418" stroke="#B08D3E" stroke-width="2"/>
    <rect x="16" y="430" width="280" height="72" rx="10" fill="#1A3A2C" stroke="#B08D3E" stroke-width="1.6"/>
    <text x="156" y="460" text-anchor="middle" fill="#FAF6ED" font-family="Georgia, serif" font-size="20" font-weight="bold">Arsenal · Galeria Suíça</text>
    <text x="156" y="485" text-anchor="middle" fill="#F0E6D2" fill-opacity="0.75" font-family="Georgia, serif" font-size="14">loja 4, dentro da galeria · nº 858</text>
  </g>

  <!-- ARSENAL VILA GERMÂNICA: loja de rua, lado NORTE -->
  <g>
    <rect x="508" y="190" width="58" height="45" rx="6" fill="#1A3A2C" stroke="#B08D3E" stroke-width="1.8"/>
    <path d="M502 190 L537 168 L572 190" fill="none" stroke="#B08D3E" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M537 232 C 529 219 522 212 522 202 a15 15 0 1 1 30 0 c0 10 -7 17 -15 30 Z" fill="#D4B36A"/>
    <circle cx="537" cy="202" r="5.5" fill="#12291F"/>
    <line x1="537" y1="168" x2="537" y2="162" stroke="#B08D3E" stroke-width="2"/>
    <rect x="394" y="90" width="284" height="72" rx="10" fill="#1A3A2C" stroke="#B08D3E" stroke-width="1.6"/>
    <text x="536" y="120" text-anchor="middle" fill="#FAF6ED" font-family="Georgia, serif" font-size="20" font-weight="bold">Arsenal · Vila Germânica</text>
    <text x="536" y="145" text-anchor="middle" fill="#F0E6D2" fill-opacity="0.75" font-family="Georgia, serif" font-size="14">loja de rua · nº 1057</text>
  </g>

  <!-- DISTÂNCIA REAL entre as lojas, pela avenida -->
  <g>
    <path d="M232 344 C 300 322 380 302 450 285 C 500 272 522 255 534 238" stroke="#D4B36A" stroke-width="2" fill="none" stroke-dasharray="7 7" opacity="0.9"/>
    <rect x="330" y="330" width="140" height="48" rx="14" fill="#12291F" stroke="#B08D3E" stroke-width="1.4"/>
    <text x="400" y="351" text-anchor="middle" fill="#D4B36A" font-family="Georgia, serif" font-size="15" font-weight="bold">≈ 230 m</text>
    <text x="400" y="370" text-anchor="middle" fill="#F0E6D2" fill-opacity="0.85" font-family="Georgia, serif" font-size="13">3 min a pé</text>
  </g>

  <!-- escala real -->
  <g stroke="#F0E6D2" stroke-opacity="0.6" stroke-width="1.6">
    <line x1="40" y1="566" x2="203" y2="566"/>
    <line x1="40" y1="560" x2="40" y2="572"/>
    <line x1="203" y1="560" x2="203" y2="572"/>
  </g>
  <text x="121" y="556" text-anchor="middle" fill="#F0E6D2" fill-opacity="0.6" font-family="Georgia, serif" font-size="12">100 m</text>

  <!-- bússola -->
  <g transform="translate(762 540)">
    <circle r="22" fill="none" stroke="#B08D3E" stroke-width="1.6" opacity="0.9"/>
    <path d="M0 -13 L5.5 7 L0 3 L-5.5 7 Z" fill="#D4B36A"/>
    <text y="-28" text-anchor="middle" fill="#F0E6D2" fill-opacity="0.7" font-family="Georgia, serif" font-size="13">N</text>
  </g>
</svg>
