<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Mapa ilustrado com a localização da unidade Vila Germânica na avenida principal de Monte Verde">
  <rect width="800" height="600" fill="#12291F"/>

  <!-- montanhas ao fundo -->
  <path d="M-10 150 L110 60 L210 140 L320 50 L440 150 L560 70 L680 150 L810 80 L810 190 L-10 190 Z" fill="#0E2119"/>
  <path d="M-10 190 L90 130 L230 195 L370 120 L520 200 L650 140 L810 200 L810 240 L-10 240 Z" fill="#102520"/>

  <!-- pinheiros -->
  <g stroke="#24503C" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M80 250 l0 26 M80 250 l-12 18 h24 z M80 260 l-15 20 h30 z"/>
    <path d="M700 240 l0 26 M700 240 l-12 18 h24 z M700 250 l-15 20 h30 z"/>
    <path d="M160 500 l0 24 M160 500 l-11 16 h22 z M160 509 l-14 18 h28 z"/>
    <path d="M640 520 l0 24 M640 520 l-11 16 h22 z M640 529 l-14 18 h28 z"/>
  </g>

  <!-- avenida -->
  <path d="M-20 430 C 180 390 320 440 430 405 C 560 366 660 400 820 350" stroke="#F0E6D2" stroke-opacity="0.85" stroke-width="30" fill="none" stroke-linecap="round"/>
  <path d="M-20 430 C 180 390 320 440 430 405 C 560 366 660 400 820 350" stroke="#12291F" stroke-width="2.5" fill="none" stroke-dasharray="14 12"/>

  <!-- ruas transversais -->
  <g stroke="#F0E6D2" stroke-opacity="0.22" stroke-width="10" stroke-linecap="round">
    <path d="M240 300 L215 555"/>
    <path d="M600 290 L630 545"/>
  </g>

  <!-- chalés decorativos -->
  <g stroke="#B08D3E" stroke-width="2.5" fill="none" stroke-linejoin="round" opacity="0.75">
    <path d="M120 340 h44 v30 h-44 z M114 340 l28 -22 l28 22"/>
    <path d="M660 470 h44 v30 h-44 z M654 470 l28 -22 l28 22"/>
    <path d="M420 480 h40 v27 h-40 z M415 480 l25 -20 l25 20"/>
  </g>

  <!-- rótulo da avenida -->
  <text x="112" y="463" fill="#F0E6D2" fill-opacity="0.6" font-family="Georgia, serif" font-size="19" font-style="italic" transform="rotate(-9 112 463)">Av. Monte Verde</text>

  <!-- GALERIA SUÍÇA: placa + pin -->
  <g opacity="0.38">
    <line x1="290" y1="300" x2="290" y2="360" stroke="#B08D3E" stroke-width="2"/>
    <rect x="140" y="228" width="300" height="74" rx="10" fill="#1A3A2C" stroke="#B08D3E" stroke-width="1.6"/>
    <text x="290" y="259" text-anchor="middle" fill="#FAF6ED" font-family="Georgia, serif" font-size="23" font-weight="bold">Galeria Suíça</text>
    <text x="290" y="285" text-anchor="middle" fill="#F0E6D2" fill-opacity="0.75" font-family="Georgia, serif" font-size="15">Av. Monte Verde, 858 · loja 4</text>
    <path d="M290 418 C 278 398 268 388 268 374 a22 22 0 1 1 44 0 c0 14 -10 24 -22 44 Z" fill="#D4B36A"/>
    <circle cx="290" cy="374" r="8.5" fill="#12291F"/>
  </g>

  <!-- VILA GERMÂNICA: placa + pin -->
  <g>
    <line x1="565" y1="470" x2="565" y2="408" stroke="#B08D3E" stroke-width="2"/>
    <rect x="415" y="470" width="300" height="74" rx="10" fill="#1A3A2C" stroke="#B08D3E" stroke-width="1.6"/>
    <text x="565" y="501" text-anchor="middle" fill="#FAF6ED" font-family="Georgia, serif" font-size="23" font-weight="bold">Vila Germânica</text>
    <text x="565" y="527" text-anchor="middle" fill="#F0E6D2" fill-opacity="0.75" font-family="Georgia, serif" font-size="15">Av. Monte Verde, 1057</text>
    <path d="M565 384 C 553 364 543 354 543 340 a22 22 0 1 1 44 0 c0 14 -10 24 -22 44 Z" fill="#D4B36A"/>
    <circle cx="565" cy="340" r="8.5" fill="#12291F"/>
  </g>

  <!-- legenda -->
  <text x="36" y="574" fill="#F0E6D2" fill-opacity="0.55" font-family="Georgia, serif" font-size="16">A poucos minutos a pé uma da outra, na avenida principal</text>

  <!-- bússola -->
  <g transform="translate(748 60)">
    <circle r="24" fill="none" stroke="#B08D3E" stroke-width="1.6" opacity="0.9"/>
    <path d="M0 -14 L6 8 L0 3 L-6 8 Z" fill="#D4B36A"/>
    <text y="-30" text-anchor="middle" fill="#F0E6D2" fill-opacity="0.7" font-family="Georgia, serif" font-size="14">N</text>
  </g>
</svg>
